<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bryan Lane — Marketing, Design & E-commerce</title>
<meta name="description" content="Marketing, design, and e-commerce work by Bryan Lane, San Diego.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --fog:#E7EBE9;      /* page */
  --mist:#F5F7F6;     /* raised surfaces */
  --harbor:#122A30;   /* ink */
  --kelp:#2E5A52;     /* secondary ink, placeholders */
  --tide:#6B7F80;     /* muted text */
  --jacaranda:#7656D1;/* the one accent */
  --rule:#C9D2CF;
  --font:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--fog);color:var(--harbor);font-family:var(--font);font-size:17px;line-height:1.55;font-variation-settings:"opsz" 14;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--jacaranda);outline-offset:3px;border-radius:4px}
.pad{padding-left:clamp(16px,5vw,72px);padding-right:clamp(16px,5vw,72px)}

/* ---------- Top bar ---------- */
.top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:60px;
  background:color-mix(in srgb,var(--fog) 86%,transparent);backdrop-filter:blur(10px);
  transform:translateY(-100%);transition:transform .35s ease}
.top.show{transform:none}
.top .mark{font-weight:700;font-size:18px;letter-spacing:-.01em;text-decoration:none}
.top .progress{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--jacaranda)}
.email{font-weight:600;font-size:15px;text-decoration:none;padding:9px 16px;border-radius:999px;background:var(--harbor);color:var(--mist)}
.email:hover{background:var(--jacaranda)}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100svh;display:grid;grid-template-rows:1fr auto;padding-top:clamp(28px,6vh,64px);padding-bottom:clamp(28px,5vh,56px)}
.hero-name{align-self:center;font-weight:800;font-variation-settings:"opsz" 96;font-size:clamp(76px,17.5vw,300px);line-height:.84;letter-spacing:-.045em}
.hero-name span{display:block;overflow:hidden}
.hero-name i{display:block;font-style:normal;transform:translateY(105%);animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}
.hero-name span:nth-child(2) i{animation-delay:.12s;color:var(--kelp)}
@keyframes rise{to{transform:none}}
.stack{position:absolute;right:clamp(16px,6vw,110px);top:50%;width:min(30vw,420px);aspect-ratio:4/5;transform:translateY(-58%);pointer-events:none}
.stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;box-shadow:0 24px 50px rgba(18,42,48,.22);opacity:0;animation:deal .9s cubic-bezier(.2,.8,.2,1) forwards}
.stack img:nth-child(1){--r:-9deg;--x:-26%;animation-delay:.35s}
.stack img:nth-child(2){--r:5deg;--x:14%;animation-delay:.5s}
.stack img:nth-child(3){--r:-1deg;--x:-4%;animation-delay:.65s}
@keyframes deal{from{opacity:0;transform:translate(0,40px) rotate(0)}to{opacity:1;transform:translate(var(--x),0) rotate(var(--r))}}
@media (max-width:1000px){.stack{display:none}}
.hero-foot{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:end;border-top:1px solid var(--rule);padding-top:22px;opacity:0;animation:fade .8s .55s forwards}
@keyframes fade{to{opacity:1}}
.hero-foot p{font-size:clamp(19px,1.8vw,24px);line-height:1.35;max-width:30ch;font-variation-settings:"opsz" 24}
.hero-meta{display:flex;flex-direction:column;align-items:flex-end;gap:14px;text-align:right}
.hero-meta small{color:var(--tide);font-size:15px}
.scroll-cue{display:inline-flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;color:var(--jacaranda)}
.scroll-cue svg{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}
@media (max-width:760px){.hero-foot{grid-template-columns:1fr}.hero-meta{align-items:flex-start;text-align:left}}

.forbanner{display:none;margin:0 0 8px;padding:12px 16px;border-radius:10px;background:#E4DDF7;color:#432C93;font-size:15px}
.forbanner a{font-weight:700}

/* ---------- Rooms (pinned horizontal galleries) ---------- */
.room{position:relative;border-top:1px solid var(--rule)}
.room-stick{position:sticky;top:0;height:100svh;display:grid;grid-template-columns:clamp(220px,24vw,340px) 1fr;overflow:hidden}
.room-head{padding:96px 28px 40px clamp(16px,5vw,72px);display:flex;flex-direction:column;gap:14px;z-index:2;background:linear-gradient(90deg,var(--fog) 82%,transparent)}
.room-head h2{font-weight:700;font-variation-settings:"opsz" 72;font-size:clamp(30px,3.2vw,46px);line-height:1;letter-spacing:-.03em}
.room-head p{color:var(--tide);font-size:16px;max-width:26ch}
.room-count{font-size:15px;font-weight:600;color:var(--jacaranda)}
.track-wrap{position:relative;display:flex;align-items:center;min-width:0}
.track{display:flex;align-items:flex-end;gap:clamp(22px,3vw,44px);padding:0 clamp(40px,8vw,140px) 0 12px;will-change:transform}
.piece{flex:none;display:flex;flex-direction:column;gap:12px;background:none;border:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.frame{height:min(58svh,520px);border-radius:3px;overflow:hidden;background:var(--mist);box-shadow:0 1px 0 var(--rule)}
.frame img{height:100%;width:auto;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.piece:hover .frame img{transform:scale(1.025)}
.ph{height:100%;aspect-ratio:4/5;background:var(--kelp);color:var(--mist);display:flex;flex-direction:column;justify-content:space-between;padding:22px}
.ph b{font-weight:700;font-size:clamp(22px,2.2vw,30px);line-height:1.05;letter-spacing:-.02em;font-variation-settings:"opsz" 48}
.ph small{font-size:14px;opacity:.75}
.cap{max-width:34ch}
.cap h3{font-weight:650;font-size:18px;line-height:1.25;letter-spacing:-.01em}
.cap p{color:var(--tide);font-size:14.5px;margin-top:2px}
.tag-concept{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:#E4DDF7;color:#432C93;font-size:12px;font-weight:600;vertical-align:2px}

/* Side index */
.index{position:fixed;right:clamp(12px,2vw,28px);top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transition:opacity .3s}
.index.show{opacity:1;pointer-events:auto}
.index a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;font-size:13px;font-weight:600;color:var(--tide)}
.index a span{opacity:0;transform:translateX(6px);transition:.25s}
.index a::after{content:"";width:18px;height:2px;background:var(--rule);transition:.25s}
.index:hover a span{opacity:1;transform:none}
.index:hover{background:color-mix(in srgb,var(--fog) 92%,transparent);border-radius:10px;padding:8px 0 8px 12px;margin-right:-0px}
.index a.on{color:var(--harbor)}
.index a.on::after{width:34px;background:var(--jacaranda)}

/* Mobile + reduced motion: native swipe instead of pinning */
.static .room{height:auto!important}
.static .room-stick{position:relative;height:auto;grid-template-columns:1fr;overflow:visible}
.static .room-head{padding:56px clamp(16px,5vw,72px) 18px;background:none}
.static .track-wrap{overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:clamp(16px,5vw,72px);padding-bottom:28px;scrollbar-width:thin}
.static .track{transform:none!important;padding:0 clamp(16px,5vw,72px)}
.static .piece{scroll-snap-align:start}
.static .frame{height:min(52svh,420px)}
@media (max-width:760px){.index{display:none}.static .frame{height:340px}.static .frame img{max-width:82vw;object-fit:cover}}

/* ---------- Detail panel ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(18,42,48,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.panel{position:fixed;z-index:31;top:0;right:0;height:100%;width:min(760px,100%);background:var(--mist);overflow-y:auto;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.open .scrim{opacity:1;pointer-events:auto}
.open .panel{transform:none}
.panel-img{background:#DCE2DF}
.panel-img img{display:block;width:100%;max-height:70svh;object-fit:contain}
.panel-img img+img{border-top:6px solid var(--mist)}
.panel-body{padding:28px clamp(20px,4vw,44px) 48px}
.panel-cat{font-size:15px;font-weight:600;color:var(--jacaranda)}
.panel-body h2{margin-top:6px;font-weight:750;font-variation-settings:"opsz" 72;font-size:clamp(30px,4vw,44px);line-height:1.02;letter-spacing:-.03em}
.facts{margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px}
.facts dt{color:var(--tide)}
.panel-desc{margin-top:20px;font-size:18px;line-height:1.6;max-width:58ch}
.panel-actions{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;padding:11px 20px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;background:var(--jacaranda);color:#fff}
.btn:hover{background:var(--harbor)}
.btn.soon{background:none;border:1.5px dashed var(--tide);color:var(--tide);pointer-events:none}
.close{position:sticky;top:14px;float:right;margin:14px 14px 0 0;width:42px;height:42px;border-radius:50%;border:none;background:var(--harbor);color:var(--mist);font-size:22px;cursor:pointer;z-index:2}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--rule);padding-top:clamp(64px,12vh,120px);padding-bottom:48px}
footer h2{font-weight:800;font-variation-settings:"opsz" 96;font-size:clamp(44px,8vw,120px);line-height:.9;letter-spacing:-.04em;max-width:12ch}
footer .row{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;font-size:16px}
footer .row a{font-weight:600}
footer .big{font-size:clamp(20px,2.4vw,30px);font-weight:700;color:var(--jacaranda);text-decoration-thickness:2px;text-underline-offset:6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero-name i{transform:none}.hero-foot{opacity:1}
}
</style>
</head>
<body>

<header class="top pad" id="top">
  <a class="mark" href="#">Bryan Lane</a>
  <a class="email" href="mailto:bryanrlane@gmail.com">Email Bryan</a>
  <div class="progress" id="progress"></div>
</header>

<section class="hero pad">
  <h1 class="hero-name" aria-label="Bryan Lane"><span><i>Bryan</i></span><span><i>Lane</i></span></h1>
  <div class="stack" id="stack" aria-hidden="true"></div>
  <div class="hero-foot">
    <div>
      <div class="forbanner" id="forbanner"></div>
      <p>Marketing, design, and online stores for small businesses and community organizations in San Diego.</p>
    </div>
    <div class="hero-meta">
      <small id="summary"></small>
      <a class="scroll-cue" href="#work">Scroll through the work
        <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1v15M1 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></a>
    </div>
  </div>
</section>

<nav class="index" id="index" aria-label="Sections"></nav>
<main id="work"></main>

<footer class="pad">
  <h2>Let's make something together.</h2>
  <div class="row">
    <a class="big" href="mailto:bryanrlane@gmail.com">bryanrlane@gmail.com</a>
    <a id="linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
    <a id="resume" href="#" target="_blank" rel="noopener">Résumé</a>
    <span style="color:var(--tide)">Based in San Diego, California</span>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" tabindex="-1">
  <button class="close" id="close" aria-label="Close">×</button>
  <div class="panel-img" id="p-img"></div>
  <div class="panel-body">
    <div class="panel-cat" id="p-cat"></div>
    <h2 id="p-title"></h2>
    <dl class="facts" id="p-facts"></dl>
    <p class="panel-desc" id="p-desc"></p>
    <div class="panel-actions" id="p-actions"></div>
  </div>
</aside>

<script>
/* ===== Settings you can change ===== */
const SHEET_ID = '1_mwttOg4vbOWfnNg-Pgs_r8Ljn0E523LgSrvFB3gOsY'; // your Google Sheet
const SHEET_TAB = '';           // optional tab name; blank = first tab
const LINKEDIN_URL = '';        // e.g. https://www.linkedin.com/in/your-name
const RESUME_URL = '';          // a link to your résumé PDF
const ROOMS = {                 // section order and the one-line intro for each
  'Websites & E-commerce': 'Online stores and sites, built and grown.',
  'Social Media Design': 'Campaigns and event promos people stopped scrolling for.',
  'Posters & Print': 'Flyers and posters for exhibits, concerts, and community events.',
  'Book Covers & Branding': 'Covers, identities, and visual systems.',
  'AI & Web Projects': 'Custom tools that save real hours, built with AI.',
  'Case Studies': 'Projects with the full story and the results.',
  'Writing': 'Award submissions that earned recognition from the music industry.',
  'Class Projects': 'Research, analysis, and creative work from SDSU and MiraCosta College.',
  'Video & Speaking': 'Writing and speaking in front of an audience.',
};
/* =================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const isOn = v => /^(true|yes|y|1|x|✓|✔)$/i.test(String(v).trim());
const tags = v => String(v||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean);

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
async function load(){
  const urls=[];
  if(SHEET_ID) urls.push(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${SHEET_TAB?'&sheet='+encodeURIComponent(SHEET_TAB):''}`);
  urls.push('portfolio.csv');
  for(const u of urls){ try{ const r=await fetch(u,{cache:'no-store'}); if(r.ok){ const d=parseCSV(await r.text()); if(d.length && 'Include' in d[0]) return d; } }catch(e){} }
  return [];
}

let items=[];
const imgs = it => String(it.Image||'').split(',').map(x=>x.trim()).filter(Boolean);
const src = n => (window.imgSrc ? window.imgSrc(n) : 'images/' + n);
const piece = (it,i) => {
  const visual = imgs(it).length
    ? `<img src="${esc(src(imgs(it)[0]))}" alt="${esc(it.Title)}" loading="lazy" data-fallback>`
    : '';
  const ph = `<div class="ph"><small>${esc(it['Client / Org'])}</small><b>${esc(it.Title)}</b></div>`;
  const concept = /concept/i.test(it['My Role']) ? '<span class="tag-concept">Concept</span>' : '';
  return `<button class="piece" data-i="${i}">
    <div class="frame">${visual || ph}</div>
    <div class="cap"><h3>${esc(it.Title)}${concept}</h3><p>${esc(it['Client / Org'])}${it.Year ? ', '+esc(it.Year) : ''}</p></div>
  </button>`;
};

function build(){
  const known = Object.keys(ROOMS);
  const cats = known.filter(c=>items.some(it=>it.Category===c))
    .concat([...new Set(items.map(it=>it.Category))].filter(c=>c && !known.includes(c)));
  $('#summary').textContent = `${items.length} pieces in ${cats.length} rooms, from 2021 to today`;
  $('#work').innerHTML = cats.map(c => {
    const list = items.map((it,i)=>[it,i]).filter(([it])=>it.Category===c);
    return `<section class="room" id="${slug(c)}" data-cat="${esc(c)}">
      <div class="room-stick">
        <div class="room-head"><h2>${esc(c)}</h2><p>${esc(ROOMS[c]||'')}</p><span class="room-count">${list.length} ${list.length===1?'piece':'pieces'}</span></div>
        <div class="track-wrap"><div class="track">${list.map(([it,i])=>piece(it,i)).join('')}</div></div>
      </div></section>`;
  }).join('') || '<p class="pad" style="padding:80px 0;color:var(--tide)">Check a box in the Include column of the sheet to show a piece here.</p>';
  $('#index').innerHTML = cats.map(c=>`<a href="#${slug(c)}" data-for="${slug(c)}"><span>${esc(c)}</span></a>`).join('');
  document.querySelectorAll('img[data-fallback]').forEach(img => {
    img.addEventListener('error', () => {
      const it = items[+img.closest('.piece').dataset.i];
      img.outerHTML = `<div class="ph"><small>${esc(it['Client / Org'])}</small><b>${esc(it.Title)}</b></div>`;
      layout();
    }, {once:true});
    img.addEventListener('load', layout, {once:true});
  });
}

/* ---- Pinned horizontal scrolling ---- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let pinned = false;
function layout(){
  pinned = !reduce.matches && innerWidth > 760;
  document.body.classList.toggle('static', !pinned);
  document.querySelectorAll('.room').forEach(room => {
    if(!pinned){ room.style.height=''; return; }
    const track = room.querySelector('.track'), wrap = room.querySelector('.track-wrap');
    const extra = Math.max(0, track.scrollWidth - wrap.clientWidth);
    room.dataset.extra = extra;
    room.style.height = `calc(100svh + ${extra}px)`;
  });
  onScroll();
}
function onScroll(){
  const y = scrollY, vh = innerHeight;
  const doc = document.documentElement.scrollHeight - vh;
  $('#progress').style.width = (doc>0 ? y/doc*100 : 0) + '%';
  $('#top').classList.toggle('show', y > vh*0.6);
  let active = null;
  document.querySelectorAll('.room').forEach(room => {
    const r = room.getBoundingClientRect();
    if(pinned){
      const extra = +room.dataset.extra || 0;
      const p = Math.min(1, Math.max(0, -r.top / Math.max(1, extra)));
      room.querySelector('.track').style.transform = `translate3d(${-p*extra}px,0,0)`;
    }
    if(r.top <= vh*0.5 && r.bottom > vh*0.5) active = room.id;
  });
  $('#index').classList.toggle('show', !!active);
  document.querySelectorAll('#index a').forEach(a => a.classList.toggle('on', a.dataset.for===active));
}

/* ---- Detail panel ---- */
let lastFocus=null;
function openPiece(i){
  const it = items[i]; lastFocus = document.activeElement;
  $('#p-img').innerHTML = imgs(it).map(n => `<img src="${esc(src(n))}" alt="${esc(it.Title)}" onerror="this.remove()">`).join('');
  $('#p-cat').textContent = it.Category;
  $('#p-title').textContent = it.Title;
  $('#p-facts').innerHTML = [['Role',it['My Role']],['For',it['Client / Org']],['When',it.Year]]
    .filter(([,v])=>v).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  $('#p-desc').textContent = it.Description;
  const label = it['Link Label'] || 'View project';
  $('#p-actions').innerHTML = it.Link
    ? `<a class="btn" href="${esc(it.Link)}" target="_blank" rel="noopener">${esc(label)}</a>`
    : (/coming soon/i.test(label) ? `<span class="btn soon">${esc(label)}</span>` : '');
  document.body.classList.add('open');
  $('#panel').scrollTop = 0; $('#panel').focus();
}
function closePiece(){ document.body.classList.remove('open'); lastFocus && lastFocus.focus(); }

document.addEventListener('click', e => {
  const p = e.target.closest('.piece'); if(p) return openPiece(+p.dataset.i);
  if(e.target.id==='close' || e.target.id==='scrim') closePiece();
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && document.body.classList.contains('open')) closePiece(); });
addEventListener('scroll', () => requestAnimationFrame(onScroll), {passive:true});
addEventListener('resize', layout);
reduce.addEventListener?.('change', layout);

(async () => {
  if(LINKEDIN_URL) $('#linkedin').href = LINKEDIN_URL; else $('#linkedin').remove();
  if(RESUME_URL) $('#resume').href = RESUME_URL; else $('#resume').remove();
  const forTag = new URLSearchParams(location.search).get('for');
  items = (await load()).filter(r => isOn(r.Include) && r.Title)
    .sort((a,b) => (parseFloat(a.Order)||999) - (parseFloat(b.Order)||999));
  if(forTag){
    items = items.filter(it => tags(it['Best For']).some(t => t.toLowerCase()===forTag.toLowerCase()));
    const fb = $('#forbanner'); fb.style.display='block';
    fb.innerHTML = `A selection for ${esc(forTag)} roles. <a href="${location.pathname}">See all work</a>`;
  }
  const ok = src => new Promise(res => { const im = new Image(); im.onload = () => res(src); im.onerror = () => res(null); im.src = src; });
  Promise.all(items.filter(it => imgs(it).length).map(it => ok(src(imgs(it)[0])))).then(list => {
    $('#stack').innerHTML = list.filter(Boolean).slice(0, 3).map(src => `<img src="${esc(src)}" alt="">`).join('');
  });
  build(); layout();
})();
</script>
</body>
</html>
